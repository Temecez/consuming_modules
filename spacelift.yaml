# Read by spacelift_admin (repo discovery). Each entry becomes a Spacelift stack
# named consuming_modules-<account>-<region>. Accounts are AWS account names
# from Organizations; you can only use accounts your team is allowed to use.
# Roles, integrations and permissions are managed by the platform, not here.
deployments:
  - account: temecez10_dev
    region: us-east-2
    var_file: envs/dev/dev.tfvars

  - account: temecez10_test
    region: us-east-2
    var_file: envs/test/test.tfvars

  - account: temecez10_prod
    region: us-east-2
    var_file: envs/prod/prod.tfvars
